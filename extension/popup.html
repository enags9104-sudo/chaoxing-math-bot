<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>超星数学助手设置</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 14px 16px 16px;
      font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #303133;
    }
    h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    label { display: block; margin-bottom: 10px; }
    label span { display: block; margin-bottom: 3px; color: #606266; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font: inherit;
      color: inherit;
    }
    textarea { resize: vertical; font-size: 12px; }
    input:focus, textarea:focus { outline: none; border-color: #3b7cff; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    button {
      padding: 6px 18px;
      border: 0;
      border-radius: 4px;
      background: #3b7cff;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:hover { opacity: .88; }
    #msg { font-size: 12px; color: #67c23a; }
    #msg.err { color: #f56c6c; }
    .hint { font-size: 11px; color: #909399; margin-top: -6px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h3>超星数学助手设置</h3>

  <label>
    <span>ECNU API Key</span>
    <input id="apiKey" type="password" placeholder="sk-...">
  </label>

  <label>
    <span>接口地址</span>
    <input id="baseUrl" type="text" placeholder="https://chat.ecnu.edu.cn/open/api/v1">
  </label>

  <label>
    <span>模型</span>
    <input id="model" type="text" placeholder="ecnu-max">
  </label>

  <label>
    <span>提示词</span>
    <textarea id="prompt" rows="7" placeholder="留空则使用内置默认提示词"></textarea>
  </label>
  <div class="hint">提示词中用 {title} 和 {content} 占位帖子标题与正文。</div>

  <div class="row">
    <button id="save">保存</button>
    <span id="msg"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
